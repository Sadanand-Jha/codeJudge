name: quizsupport

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizsupport}
      POSTGRES_USER: ${POSTGRES_USER:-quizsupport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizsupport}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/dumps:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    image: quizsupport-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pm2-runtime", "start", "ecosystem.config.cjs"]
    env_file:
      - .env
    environment: &backend-env
      NODE_ENV: production
      PORT: "8000"
      TZ: UTC
      DATABASE_URL: postgresql://${POSTGRES_USER:-quizsupport}:${POSTGRES_PASSWORD:-quizsupport}@postgres:5432/${POSTGRES_DB:-quizsupport}
      DATABASE_SSL: "false"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-quizsupport}
      PGUSER: ${POSTGRES_USER:-quizsupport}
      PGPASSWORD: ${POSTGRES_PASSWORD:-quizsupport}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SECURE_MEDIA_DIR: /app/secure-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./secure-media:/app/secure-media
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true
    stop_grace_period: 45s
    shm_size: 512mb
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis-data:
