services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizsupport}
      POSTGRES_USER: ${POSTGRES_USER:-quizsupport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizsupport}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/dumps:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: code-judge-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "node dist/scripts/ensureBaseSchema.js && node dist/migrate.js"]
    env_file:
      - .env
    environment: &backend-env
      NODE_ENV: production
      PORT: "8000"
      TZ: UTC
      DATABASE_URL: postgresql://${POSTGRES_USER:-quizsupport}:${POSTGRES_PASSWORD:-quizsupport}@postgres:5432/${POSTGRES_DB:-quizsupport}
      DATABASE_SSL: "false"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-quizsupport}
      PGUSER: ${POSTGRES_USER:-quizsupport}
      PGPASSWORD: ${POSTGRES_PASSWORD:-quizsupport}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SECURE_MEDIA_DIR: /app/secure-media
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: code-judge-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pm2-runtime", "start", "ecosystem.config.cjs"]
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./secure-media:/app/secure-media
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true
    stop_grace_period: 45s
    shm_size: 512mb
    restart: unless-stopped

  cloudflared-tunnel:
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    secrets:
      - cloudflared_credentials
    depends_on:
      api:
        condition: service_healthy

secrets:
  cloudflared_credentials:
    file: ${CLOUDFLARED_CREDENTIALS_FILE:-/home/sadanand-jha/.cloudflared/19209164-9521-42c0-ac87-017d2786f98c.json}

volumes:
  postgres_data:
  redis-data:
